[build]
command = "npm run build"
publish = "build/client"

[dev]
command = "npm run dev"

# React Router 7 SSR configuration
[functions]
directory = "build/server"
node_bundler = "esbuild"

# Static pages (including /thank-you for Netlify Forms) take precedence over SSR.
[[redirects]]
from = "/*"
to = "/.netlify/functions/server"
status = 200
force = false

# Environment settings
[build.environment]
NODE_VERSION = "18"

# Forms configuration
[forms]
settings = { autodetect = true }
