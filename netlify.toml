[build]
command = "npm run build"
publish = "build/client"

[dev]
command = "npm run dev"

# React Router 7 SSR configuration
[functions]
directory = "build/server"
node_bundler = "esbuild"

# Serve static assets first, then fallback to SSR (exclude POST for forms)
[[redirects]]
from = "/*"
to = "/.netlify/functions/server"
status = 200
force = false
conditions = {Method = ["GET", "HEAD"]}

# Environment settings
[build.environment]
NODE_VERSION = "18"

# Forms configuration
[forms]
settings = { autodetect = true }
