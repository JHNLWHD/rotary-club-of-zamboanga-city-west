<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Received | Rotary Club of Zamboanga City West</title>
  <meta name="description" content="Your message to Rotary Club of Zamboanga City West has been submitted.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://rotaryzcwest.org/thank-you">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #082b49; font-family: "Open Sans", sans-serif; }
    main { max-width: 800px; margin: 0 auto; padding: clamp(64px, 15vh, 120px) 24px; text-align: center; }
    svg { color: #005fae; margin-bottom: 24px; }
    .eyebrow { color: #005fae; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.2; letter-spacing: -.04em; margin: 12px 0 24px; }
    .message { max-width: 620px; margin: 0 auto; color: #374151; font-size: 18px; line-height: 1.8; }
    a { display: inline-block; margin-top: 36px; padding: 14px 24px; border-radius: 6px; background: #005fae; color: #fff; font-weight: 700; text-decoration: none; }
    a:hover { background: #004581; }
    a:focus-visible { outline: 3px solid #ba8700; outline-offset: 4px; }
  </style>
</head>
<body>
  <!-- Keep this endpoint static so Netlify Forms receives the POST before SSR. -->
  <main>
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <path d="m9 12 2 2 4-4"></path>
    </svg>
    <p class="eyebrow">Message submitted</p>
    <h1>Thank you for reaching out.</h1>
    <p class="message">Your message will be reviewed by the club and routed to the appropriate person for follow-up.</p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
